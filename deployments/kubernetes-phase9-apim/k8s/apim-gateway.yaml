# Azure API Management Self-Hosted Gateway
# Deployed in AKS with Dapr sidecar for backend service invocation
#
# Architecture: Internet → Azure Load Balancer → APIM Gateway (with Dapr) → Backend services
# The APIM service is type: LoadBalancer, getting its own public IP from Azure.
---
apiVersion: v1
kind: Namespace
metadata:
  name: apim-gateway
  labels:
    app.kubernetes.io/name: apim-gateway
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apim-gateway-env
  namespace: apim-gateway
data:
  config.service.endpoint: ""  # Set by deploy script: https://{apim-name}.configuration.azure-api.net
---
apiVersion: v1
kind: Secret
metadata:
  name: apim-gateway-token
  namespace: apim-gateway
type: Opaque
data:
  value: ""  # Set by deploy script: base64 encoded gateway token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apim-gateway
  namespace: apim-gateway
  labels:
    app: apim-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apim-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: apim-gateway
      annotations:
        # Dapr sidecar for service invocation to backend services
        dapr.io/enabled: "true"
        dapr.io/app-id: "apim-gateway"
        dapr.io/app-port: "8080"
        dapr.io/config: "tracing"
        dapr.io/log-level: "info"
        dapr.io/enable-api-logging: "true"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: apim-gateway
        image: mcr.microsoft.com/azure-api-management/gateway:2.5.0
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: https
          containerPort: 8081
          protocol: TCP
        - name: metrics
          containerPort: 4290
          protocol: TCP
        env:
        - name: config.service.auth
          valueFrom:
            secretKeyRef:
              name: apim-gateway-token
              key: value
        - name: config.service.endpoint
          valueFrom:
            configMapKeyRef:
              name: apim-gateway-env
              key: config.service.endpoint
        # Gateway behavior settings
        - name: net.server.http.forwarded.proto.enabled
          value: "true"
        - name: net.server.http.forwarded.for.enabled
          value: "true"
        # Telemetry
        - name: telemetry.logs.std
          value: "text"
        - name: telemetry.logs.std.level
          value: "info"
        # Rate limiting local storage (for demo; use Redis in production)
        - name: rate.limit.storage.type
          value: "internal"
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /status-0123456789abcdef
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /status-0123456789abcdef
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: apim-gateway
  namespace: apim-gateway
  labels:
    app: apim-gateway
  annotations:
    # Azure DNS label - creates dapr-demo-api.{region}.cloudapp.azure.com
    service.beta.kubernetes.io/azure-dns-label-name: "dapr-demo-api"
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8081
    protocol: TCP
  selector:
    app: apim-gateway
---
# HorizontalPodAutoscaler for production scaling
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apim-gateway-hpa
  namespace: apim-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apim-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

# Ingress for APIM cloud gateway traffic
# Routes /apim/v1.0/* requests to the Dapr sidecar (api-gateway-dapr service),
# stripping the /apim prefix so Dapr receives standard /v1.0/invoke/... URLs.
#
# No OAuth2 auth annotation — APIM handles authentication via subscription keys.
# This ingress coexists with Phase 8's API and web ingress resources.
#
# Architecture: APIM Cloud Gateway → nginx-ingress → Dapr sidecar → backend services

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dapr-demo-ingress-apim
  namespace: dapr-demo
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: "$1"
spec:
  ingressClassName: dapr
  tls:
  - hosts:
    - FQDN_PLACEHOLDER
    secretName: dapr-demo-tls
  rules:
  - host: FQDN_PLACEHOLDER
    http:
      paths:
        # APIM routes: /apim/v1.0/invoke/{service}/method/{endpoint}
        # Rewrite strips /apim, Dapr receives /v1.0/invoke/{service}/method/{endpoint}
        - path: /apim(/v1\.0/.*)
          pathType: ImplementationSpecific
          backend:
            service:
              name: api-gateway-dapr
              port:
                number: 80

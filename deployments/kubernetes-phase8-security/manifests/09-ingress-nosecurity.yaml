apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dapr-demo-ingress
  namespace: dapr-demo
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: dapr
  rules:
  - http:
      paths:
        # Dapr service invocation API - routes to the api-gateway Dapr sidecar
        # External calls: /v1.0/invoke/catalog-service/method/products
        - path: /v1.0
          pathType: Prefix
          backend:
            service:
              name: api-gateway-dapr
              port:
                number: 80
        # Everything else routes to web-app (if deployed)
        # Without web-app, these routes will 503
        - path: /
          pathType: Prefix
          backend:
            service:
              name: web-app
              port:
                number: 80

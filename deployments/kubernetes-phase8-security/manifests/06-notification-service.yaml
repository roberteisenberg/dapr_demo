apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: dapr-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "notification-service"
        dapr.io/app-port: "8082"
        dapr.io/log-level: "info"
        dapr.io/config: "tracing"
    spec:
      containers:
      - name: notification-service
        image: reisenberg100/dapr-notification-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8082
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
# No Kubernetes Service needed - accessed via Dapr service invocation

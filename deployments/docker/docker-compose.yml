version: '3.8'

services:
  ############################
  # Infrastructure
  ############################

  # Redis - State store and Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - dapr-network

  # Dapr Placement Service
  placement:
    image: "daprio/dapr:1.14.4"
    container_name: dapr-placement
    command: ["./placement", "-port", "50006"]
    ports:
      - "50006:50006"
    networks:
      - dapr-network

  ############################
  # Catalog Service + Sidecar
  ############################
  catalog-service:
    build: ../../services/catalog-service
    container_name: catalog-service
    ports:
      - "8080:8080"
    networks:
      - dapr-network
    depends_on:
      - redis
      - placement

  catalog-dapr:
    image: "daprio/daprd:1.14.4"
    container_name: catalog-dapr
    command:
      [
        "./daprd",
        "--app-id", "catalog-service",
        "--app-port", "8080",
        "--dapr-http-port", "3500",
        "--dapr-grpc-port", "50001",
        "--resources-path", "/components",
        "--placement-host-address", "placement:50006"
      ]
    volumes:
      - "./components:/components"
    depends_on:
      - catalog-service
      - placement
    network_mode: "service:catalog-service"

  ############################
  # Order Service + Sidecar
  ############################
  order-service:
    build: ../../services/order-service
    container_name: order-service
    ports:
      - "8081:8081"
    networks:
      - dapr-network
    depends_on:
      - redis
      - placement

  order-dapr:
    image: "daprio/daprd:1.14.4"
    container_name: order-dapr
    command:
      [
        "./daprd",
        "--app-id", "order-service",
        "--app-port", "8081",
        "--dapr-http-port", "3500",
        "--dapr-grpc-port", "50001",
        "--resources-path", "/components",
        "--placement-host-address", "placement:50006"
      ]
    volumes:
      - "./components:/components"
    depends_on:
      - order-service
      - placement
    network_mode: "service:order-service"

  ############################
  # Notification Service + Sidecar
  ############################
  notification-service:
    build: ../../services/notification-service
    container_name: notification-service
    ports:
      - "8082:8082"
    networks:
      - dapr-network
    depends_on:
      - redis
      - placement

  notification-dapr:
    image: "daprio/daprd:1.14.4"
    container_name: notification-dapr
    command:
      [
        "./daprd",
        "--app-id", "notification-service",
        "--app-port", "8082",
        "--dapr-http-port", "3500",
        "--dapr-grpc-port", "50001",
        "--resources-path", "/components",
        "--placement-host-address", "placement:50006"
      ]
    volumes:
      - "./components:/components"
    depends_on:
      - notification-service
      - placement
    network_mode: "service:notification-service"

networks:
  dapr-network:
    driver: bridge

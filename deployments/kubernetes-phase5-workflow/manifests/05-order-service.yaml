apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: dapr-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "order-service"
        dapr.io/app-port: "8081"
        dapr.io/log-level: "info"
        dapr.io/config: "tracing"
    spec:
      containers:
      - name: order-service
        image: order-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8081
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
# No Kubernetes Service needed - accessed via Dapr service invocation

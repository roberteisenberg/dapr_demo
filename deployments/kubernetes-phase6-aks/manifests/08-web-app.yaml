# Optional: React web application frontend
# Deploy with: ./scripts/deploy-all.sh --with-frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: dapr-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: web-app
        image: reisenberg100/dapr-web-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "50m"
---
apiVersion: v1
kind: Service
metadata:
  name: web-app
  namespace: dapr-demo
spec:
  selector:
    app: web-app
  ports:
  - port: 80
    targetPort: 80
